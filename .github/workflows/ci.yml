name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  auth-postgrest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r supabase/tests/requirements.txt
      - name: Real disposable Auth, PostgREST and database policies
        run: python supabase/tests/run_local_stack.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm run test:toolchain
      - run: npm run lint -- --max-warnings 0
      - run: npm run type-check
      - run: npm test
      - name: Build offline demo for web
        run: npx expo export --platform web
        env:
          CI: '1'
          EXPO_OFFLINE: '1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: e2e/artifacts/

  database-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: skillforge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r supabase/tests/requirements.txt
      - run: python -m pytest -q supabase/tests
        env:
          SKILLFORGE_TEST_ADMIN_URL: postgresql://postgres:skillforge-test-only@localhost:5432/postgres
